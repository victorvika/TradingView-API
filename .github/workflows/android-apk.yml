name: Android sample APK

# Builds android-sample/ on a free GitHub-hosted runner: the no-laptop path.
# Download the APK from the run's "Artifacts" section and install it with `adb install`
# or by opening the file on the phone (allow "install unknown apps" for your browser).
on:
  push:
    branches:
      - arena/0328229a-tradingview-api
    paths:
      - 'android-sample/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-sample

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          # GitHub runs bash with `set -eo pipefail`, so `yes | sdkmanager --licenses`
          # fails on SIGPIPE: the license step must tolerate a non-zero exit.
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found - installing the command line tools"
            mkdir -p "$HOME/android-sdk/cmdline-tools"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
            mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
            SDKMANAGER="$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager"
            echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          fi
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create the Gradle wrapper
        run: gradle wrapper --gradle-version 8.7 --no-daemon

      - name: Unit tests (protocol layer)
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: tvchart-debug-apk
          path: android-sample/app/build/outputs/apk/debug/app-debug.apk
