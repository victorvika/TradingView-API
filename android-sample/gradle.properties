org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true

# The app deliberately uses no AndroidX: only framework classes + OkHttp.
# (Keeps the dependency list to Maven Central artifacts only.)

# Termux / aarch64 only: Google ships an x86_64-only aapt2, so on a phone you must
# point Gradle at the aarch64 aapt2 from `pkg install aapt2`. Put that line in the
# USER file (~/.gradle/gradle.properties), never here, so the project stays portable:
#   android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
